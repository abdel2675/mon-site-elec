<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Électricien du Sud - Dépannage & Petits Travaux</title>
    <link rel="stylesheet" href="1style.css">
</head>
<body>

    <!-- Titre -->
    <h1>Électricien du Sud</h1>
    
    <!-- Conteneur Flexbox pour aligner les 3 images (gauche, milieu, droite) -->
    <div style="display: flex; justify-content: space-between; gap: 20px; margin: 20px 0;">
        
      

        <!-- Image 2 (Milieu) -->
        <img src="electricien2.png" alt="Électricien du Sud - Photo 2" style="max-width: 200px !important; width: 100% !important; height: auto !important; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

        <!-- Image 3 (Droite) -->
        <img src="electricien1.png" alt="Électricien du Sud - Photo 3" style="max-width: 200px !important; width: 100% !important; height: auto !important; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

    </div>

    <p>Dépannage d'urgence, petits travaux et remplacement de matériel défectueux.</p>

    <!-- Bouton d'appel rapide -->
    <p><strong>Urgence ou devis ?</strong> <a href="tel:0612345678">Appelez-moi directement</a></p>

    <hr>

    <!-- Formulaire de contact -->
    <h2>Demande de contact</h2>
    <form action="https://formspree.io/f/xgaaoawz" method="POST" onsubmit="return validerFormulaire()">
        <p>
            <label for="name">Nom :</label>
            <input type="text" id="name" name="name" required>
        </p>
        <p>
            <label for="phone">Téléphone :</label>
            <input type="tel" id="phone" name="phone" required>
        </p>
        <p>
            <label for="message">Votre besoin :</label><br>
            <textarea id="message" name="message" rows="4" cols="30" placeholder="Ex: Remplacement de prise, panne de disjoncteur..."></textarea>
        </p>
        <button type="submit">Envoyer la demande</button>
    </form>

    <script>
    function validerFormulaire() {
      var nom = document.getElementById("name").value;
      var telephone = document.getElementById("phone").value;
      var besoin = document.getElementById("message").value;
      
      var telephoneNettoye = telephone.replace(/[\s\.-]/g, '');
      var regexTelephone = /^[0-9]{10}$/;

      if (nom === "" || telephone === "" || besoin === "") {
        alert("Veuillez remplir tous les champs.");
        return false;
      }

      if (!regexTelephone.test(telephoneNettoye)) {
        alert("Veuillez entrer un numéro de téléphone valide à 10 chiffres (ex: 0612345678).");
        return false;
      }

      return true;
    }
    </script>
</body>
</html>
